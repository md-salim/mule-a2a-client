# ============================================================
#  MULE A2A CLIENT — CONFIGURATION
# ============================================================

# ---- HTTP Listener Port ----
# A2A Client runs on port 8084
# Port allocation: 8081=ci-sf-account-sys | 8082=mule-mcp-server | 8083=mule-a2a-server | 8084=mule-a2a-client
http.port=8084

# ---- A2A Agent URL ----
# Full URL of the A2A agent server (mule-a2a-server).
# The A2A connector client resolves /rpc and /.well-known/agent-card.json automatically.
a2a.agent.url=http://localhost:8083/v1/sf-account-agent

# ---- Logging ----
logging.category=com.centric.a2aclient