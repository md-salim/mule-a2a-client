# ============================================================
#  MULE A2A CLIENT — CONFIGURATION
# ============================================================

# ---- HTTP Listener Port ----
# A2A Client runs on port 8084
# Port allocation: 8081=ci-sf-account-sys | 8082=mule-mcp-server | 8083=mule-a2a-server | 8084=mule-a2a-client
http.port=8084

# ---- A2A Agent Server (target) ----
# The A2A server this client connects to (mule-a2a-server on port 8083).
# The connector 2.0.0 provides server-side only — client uses JSON-RPC over HTTP.
a2a.agent.host=localhost
a2a.agent.port=8083
a2a.agent.basePath=/v1/sf-account-agent

# ---- Logging ----
logging.category=com.centric.a2aclient