# ============================================================
#  MULE A2A CLIENT — CONFIGURATION
# ============================================================

# ---- HTTP Listener Port ----
# A2A Client runs on port 8084
# Port allocation: 8081=ci-sf-account-sys | 8082=mule-mcp-server | 8083=mule-a2a-server | 8084=mule-a2a-client
http.port=8084

# ---- A2A Agent URL ----
# Full URL of the A2A agent server (mule-a2a-server).
# The A2A connector client resolves /rpc and /.well-known/agent-card.json automatically.
a2a.agent.url=http://localhost:8083/v1/sf-account-agent

# ---- Security — Bearer Token ----
# Bearer token sent to the A2A agent server on every request.
# Must match the a2a.security.bearer.token value configured on mule-a2a-server.
# Sent as HTTP header:  Authorization: Bearer <token>
# PRODUCTION: encrypt this value with AES/CBC using the Mule Secure Properties Tool,
#             then reference it as ${secure::a2a.security.bearer.token}
# DEVELOPMENT: plain value is acceptable when running locally
a2a.security.bearer.token=a2a-sf-account-2024

# ---- Logging ----
logging.category=com.centric.a2aclient
